<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Worker Attendance</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
body{margin:0;font-family:system-ui;background:#f1f5f9;color:#0f172a}.app{max-width:900px;margin:auto;padding:14px 14px 90px}header{background:#0f172a;color:#fff;padding:14px;border-radius:0 0 16px 16px}h1{font-size:20px;margin:0}.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}.stats{grid-template-columns:repeat(3,1fr);margin:12px 0}.n{font-size:26px;font-weight:900}.muted{font-size:12px;color:#64748b}.camera{width:100%;aspect-ratio:3/4;object-fit:cover;background:#020617;border-radius:14px}.mirror{transform:scaleX(-1)}button,select,input{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid #cbd5e1;margin-top:8px}button{border:0;background:#2563eb;color:#fff;font-weight:800}.green{background:#15803d}.orange{background:#b45309}.gray{background:#475569}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.active{background:#0f172a}.hidden{display:none}.msg{margin-top:10px;padding:11px;border-radius:12px;background:#eff6ff}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#166534}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding:7px}.panel{display:none}.panel.show{display:block}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}.camera{aspect-ratio:4/3}}
</style>
</head>
<body>
<header><h1>👷 Worker Attendance</h1><div class="muted">Face + Photo + 50m Location</div></header>
<div class="app">
<div class="grid stats">
<div class="card"><div id="mWorkers" class="n">0</div><div class="muted">Workers</div></div>
<div class="card"><div id="mPresent" class="n">0</div><div class="muted">आज Present</div></div>
<div class="card"><div id="mFace" class="n" style="font-size:16px">Checking</div><div class="muted">Face Recognition</div></div>
</div>

<section id="att" class="panel show">
<div class="grid two">
<div class="card">
<h2>📸 Attendance फोटो</h2>
<video id="attVideo" class="camera mirror" autoplay playsinline muted></video>
<button class="gray" onclick="startCam('att')">▶ Camera Start</button>
<button class="gray" onclick="toggleCamera('att')">🔄 Camera बदलें</button>
<button onclick="capture('att')">📸 फोटो लें</button>
<img id="attPreview" class="camera hidden" alt="preview">
</div>
<div class="card">
<h2>✅ Attendance Mode</h2>
<div>
<button class="orange" onclick="autoAttendance()">🙂 Face से पहचानें</button>
</div>
<div id="attMsg" class="msg">पहले फोटो लें। Attendance के समय Location permission Allow करें।</div>
</div>
</div>
</section>

<section id="reg" class="panel">
<div class="grid two">
<div class="card">
<h2>🧑 Worker फोटो</h2>
<video id="regVideo" class="camera mirror" autoplay playsinline muted></video>
<button class="gray" onclick="startCam('reg')">▶ Camera Start</button>
<button class="gray" onclick="toggleCamera('reg')">🔄 Camera बदलें</button>
<button onclick="capture('reg')">📸 फोटो लें</button>
<img id="regPreview" class="camera hidden" alt="preview">
</div>
<div class="card">
<h2>➕ नया Worker</h2>
<input id="workerCode" placeholder="Worker ID">
<input id="workerName" placeholder="नाम">
<input id="workerDept" placeholder="Department / Site">
<button class="green" onclick="registerWorker()">Worker Save करें</button>
<div id="regMsg" class="msg">सामने से साफ फोटो लें।</div>
</div>
</div>
</section>

<section id="report" class="panel">
<div class="card">
<h2>📋 Attendance Report</h2>
<input id="reportDate" type="date">
<button onclick="loadReport()">Filter</button>
<a href="/api/export.csv"><button>⬇ CSV Export</button></a>
<div id="records"></div>
</div>
</section>
</div>

<nav class="nav">
<button data-tab="att" onclick="tab('att')">📸 Attendance</button>
<button data-tab="reg" onclick="tab('reg')">➕ Worker</button>
<button data-tab="report" onclick="tab('report')">📋 Report</button>
</nav>

<script>
const state={photos:{},streams:{},facing:{att:'user',reg:'user'},workers:[]}
const $=x=>document.getElementById(x);
function msg(id,t,type=''){const e=$(id);e.textContent=t;e.className='msg '+type}
async function api(u,o={}){const r=await fetch(u,o);let j;try{j=await r.json()}catch{j={detail:'Server error'}}if(!r.ok)throw Error(j.detail||'Error');return j}
function stop(k){if(state.streams[k]){state.streams[k].getTracks().forEach(t=>t.stop());delete state.streams[k]}}
async function startCam(k){try{stop(k);const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing[k]}},audio:false});state.streams[k]=s;$(k+'Video').srcObject=s;$(k+'Video').classList.toggle('mirror',state.facing[k]==='user')}catch(e){msg(k+'Msg','Camera permission Allow करें।','err')}}
async function toggleCamera(k){state.facing[k]=state.facing[k]==='user'?'environment':'user';await startCam(k)}
function capture(k){const v=$(k+'Video');if(!v.videoWidth){msg(k+'Msg','पहले camera start करें।','err');return}const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');if(state.facing[k]==='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);state.photos[k]=c.toDataURL('image/jpeg',.82);$(k+'Preview').src=state.photos[k];$(k+'Preview').classList.remove('hidden');msg(k+'Msg','फोटो तैयार है।','ok')}
function getLocation(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(Error('Location उपलब्ध नहीं है।'));navigator.geolocation.getCurrentPosition(p=>res({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>rej(Error('Location permission Allow करें।')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}   
async function refresh(){try{const [s,w]=await Promise.all([api('/api/status'),api('/api/workers')]);$('mWorkers').textContent=s.workers;$('mPresent').textContent=s.present_today;$('mFace').textContent=s.face_recognition_ready?'Ready ✓':'Not Ready';state.workers=w}catch(e){msg('attMsg',e.message,'err')}}
async function registerWorker(){try{if(!state.photos.reg)throw Error('Registration फोटो लें।');const j=await api('/api/workers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({worker_code:$('workerCode').value,name:$('workerName').value,department:$('workerDept').value,photo:state.photos.reg})});msg('regMsg',j.face_saved?'Worker save और face template तैयार।':'Worker save हो गया।','ok');$('workerCode').value=$('workerName').value=$('workerDept').value='';await refresh()}catch(e){msg('regMsg',e.message,'err')}}
async function autoAttendance(){try{if(!state.photos.att)throw Error('Attendance फोटो लें।');msg('attMsg','Location और face check हो रहे हैं...');const l=await getLocation();const j=await api('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo:state.photos.att,latitude:l.latitude,longitude:l.longitude})});msg('attMsg',`${j.worker} पहचान लिया गया — Match ${Math.round((j.confidence||0)*100)}%`,'ok');await refresh()}catch(e){msg('attMsg',e.message,'err')}}
async function loadReport(){try{const q=$('reportDate').value?'?date='+$('reportDate').value:'';const r=await api('/api/attendance'+q);$('records').innerHTML=r.length?r.map(x=>`<div class="card"><b>${x.name}</b><br>${x.attendance_date} ${x.attendance_time}<br><span class="muted">${x.method==='face_recognition'?'Face':'Manual'}${x.confidence?' • '+Math.round(x.confidence*100)+'%':''}</span></div>`).join(''):'कोई record नहीं है।'}catch(e){$('records').textContent='Report load नहीं हुई।'}}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('show',x.id===id));if(id==='report')loadReport()}
window.addEventListener('pagehide',()=>{stop('att');stop('reg')});
refresh();loadReport();
</script>
</body>
</html>
